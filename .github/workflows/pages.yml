name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with self-hosted AI files
        run: |
          set -e
          V=0.10.14
          mkdir -p _site/mp/wasm
          cp -r index.html sw.js logo.png apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/ 2>/dev/null || true
          [ -d samples ] && cp -r samples _site/ || true
          [ -d guide ] && cp -r guide _site/ || true
          curl -fsSL "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@$V/vision_bundle.mjs" -o _site/mp/vision_bundle.mjs
          for f in vision_wasm_internal.js vision_wasm_internal.wasm vision_wasm_nosimd_internal.js vision_wasm_nosimd_internal.wasm; do
            curl -fsSL "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@$V/wasm/$f" -o "_site/mp/wasm/$f"
          done
          curl -fsSL "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" -o _site/mp/pose_landmarker_full.task
          curl -fsSL "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite" -o _site/mp/deeplab_v3.tflite
          ls -la _site _site/mp _site/mp/wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
